name: Sync copilot-instructions.md to AutoReviewTest

# Local trigger workflow (calling repo).
# Contains NO secrets and NO logic — it only orchestrates a call to the
# centralized reusable workflow in OrganizationCodeAggresive/ETK-Workflows.
#
# When the copilot-instructions.md source file changes on `main`, this workflow
# calls the reusable sync workflow, which copies the file into
# OrganizationCodeAggresive/AutoReviewTest at .github/copilot-instructions.md
# (opening a pull request there).

on:
  push:
    branches:
      - main
    paths:
      - 'integrations/github-copilot/copilot-instructions.md'
  workflow_dispatch:

jobs:
  sync:
    uses: OrganizationCodeAggresive/ETK-Workflows/.github/workflows/sync-copilot-instructions.yml@main
    with:
      source_repo: ${{ github.repository }}
      source_path: integrations/github-copilot/copilot-instructions.md
      target_repo: OrganizationCodeAggresive/AutoReviewTest
      target_path: .github/copilot-instructions.md
      source_branch: main
      target_branch: main
    # No secrets are stored in this repo. `inherit` forwards the caller's
    # available org-level credentials (secrets.APP_KEY + vars.APP_ID) down the
    # chain so the reusable workflow can mint a short-lived GitHub App token.
    secrets: inherit
